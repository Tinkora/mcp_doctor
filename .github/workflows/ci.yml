name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality and security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Check formatting
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo fmt --all -- --check

      - name: Run tests
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo test --locked

      - name: Run strict Clippy
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Build release binary
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo build --release --locked

      - name: Install supply-chain tools
        run: |
          cargo +1.85.0 install cargo-deny --version 0.20.2 --locked
          cargo +1.85.0 install cargo-audit --version 0.22.2 --locked

      - name: Check dependency policy
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo deny check

      - name: Audit dependencies
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo audit --no-yanked

  windows:
    name: Windows behavior
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install Rust
        shell: pwsh
        run: rustup toolchain install 1.85.0 --profile minimal --component clippy,rustfmt --no-self-update

      - name: Test Windows behavior
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo test --locked

      - name: Run strict Clippy
        shell: pwsh
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
        run: cargo clippy --all-targets --locked -- -D warnings
