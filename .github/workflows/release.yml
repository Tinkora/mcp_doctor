name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version to validate without publishing
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and tag target
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "${RELEASE_TAG}" == "v${version}" ]] || {
            echo "${RELEASE_TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no ${version} release entry" >&2
            exit 1
          }
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            [[ "${tag_commit}" == "${GITHUB_SHA}" ]] || {
              echo "release tag does not identify the workflow commit" >&2
              exit 1
            }
          fi

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "${status}" == "404" ]] || {
            echo "release lookup returned HTTP ${status}; refusing to continue" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: mcp-doctor
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary: mcp-doctor
          - runner: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: mcp-doctor
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: mcp-doctor.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup target add "${TARGET}" --toolchain 1.85.0

      - name: Build release binary
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="mcp-doctor-${RELEASE_TAG}-${PLATFORM}"
          mkdir -p "staging/${asset}" dist
          cp "target/${TARGET}/release/${BINARY}" "staging/${asset}/"
          cp LICENSE README.md README.zh-CN.md CHANGELOG.md "staging/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C staging "${asset}"
          (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "mcp-doctor-${env:RELEASE_TAG}-${env:PLATFORM}"
          $packageDir = "staging/${asset}"
          New-Item -ItemType Directory -Path $packageDir, dist -Force | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BINARY}" $packageDir
          Copy-Item LICENSE, README.md, README.zh-CN.md, CHANGELOG.md $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/${asset}.zip"
          $hash = (Get-FileHash "dist/${asset}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$PWD/dist/${asset}.zip.sha256",
            "${hash}  ${asset}.zip`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-doctor-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: Generate CycloneDX SBOM
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install SBOM tooling
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate and verify SBOM
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo +1.85.0 --locked cyclonedx \
            --format json \
            --describe crate \
            --target all \
            --spec-version 1.5
          mkdir -p dist
          old_ref="$(jq -er '.metadata.component["bom-ref"]' mcp-doctor.cdx.json)"
          normalized_ref="pkg:cargo/mcp-doctor@${RELEASE_TAG#v}"
          serial_number="$(python3 -c \
            'import sys, uuid; print(f"urn:uuid:{uuid.uuid5(uuid.NAMESPACE_URL, sys.argv[1])}")' \
            "https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}#${RELEASE_TAG}")"
          jq \
            --arg old_ref "${old_ref}" \
            --arg normalized_ref "${normalized_ref}" \
            --arg serial_number "${serial_number}" '
            .serialNumber = $serial_number
            | .metadata.component["bom-ref"] = $normalized_ref
            | .metadata.component.purl = $normalized_ref
            | .metadata.component.components |= map(
                (.purl | capture("#(?<path>.+)$").path) as $path
                | .["bom-ref"] = ($normalized_ref + "#" + $path)
                | .purl = ($normalized_ref + "#" + $path)
              )
            | .dependencies |= map(
                if .ref == $old_ref then .ref = $normalized_ref else . end
              )
          ' mcp-doctor.cdx.json > "dist/mcp-doctor-${RELEASE_TAG}.cdx.json"
          jq -e --arg version "${RELEASE_TAG#v}" '
            .bomFormat == "CycloneDX"
            and .specVersion == "1.5"
            and .metadata.component.name == "mcp-doctor"
            and .metadata.component.version == $version
            and (.components | length > 0)
            and (.dependencies | length > 0)
          ' "dist/mcp-doctor-${RELEASE_TAG}.cdx.json" >/dev/null
          if grep -Eq 'path\+file:|download_url=file:' "dist/mcp-doctor-${RELEASE_TAG}.cdx.json"; then
            echo "SBOM contains a checkout-local package reference" >&2
            exit 1
          fi
          (cd dist && sha256sum "mcp-doctor-${RELEASE_TAG}.cdx.json" \
            > "mcp-doctor-${RELEASE_TAG}.cdx.json.sha256")

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-doctor-sbom
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify release assets
    needs: [build, sbom]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify asset set and checksums
        run: |
          set -euo pipefail
          [[ "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" == "10" ]] || {
            echo "expected four archives, four archive checksums, one SBOM, and one SBOM checksum" >&2
            exit 1
          }
          (cd release-assets && sha256sum --check --strict -- ./*.sha256)

  attest:
    name: Attest release archives and SBOM
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

      - name: Attest release SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip
          sbom-path: release-assets/mcp-doctor-${{ env.RELEASE_TAG }}.cdx.json

  release:
    name: Publish GitHub Release
    needs: [verify, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Reverify tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" == "${GITHUB_SHA}" ]] || {
            echo "release tag changed during the workflow" >&2
            exit 1
          }
          (cd release-assets && sha256sum --check --strict -- ./*.sha256)
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          [[ "${#assets[@]}" == "10" ]] || {
            echo "unexpected release asset count" >&2
            exit 1
          }
          release_id="$(gh api \
            --method POST \
            "repos/${GH_REPO}/releases" \
            -f tag_name="${RELEASE_TAG}" \
            -f target_commitish="${GITHUB_SHA}" \
            -f name="MCP Doctor ${RELEASE_TAG}" \
            -F draft=true \
            -F prerelease=false \
            -F generate_release_notes=true \
            --jq '.id')"
          release_json="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          test "$(jq -r '.tag_name' <<< "${release_json}")" = "${RELEASE_TAG}"
          test "$(jq -r '.draft' <<< "${release_json}")" = true
          gh release upload "${RELEASE_TAG}" "${assets[@]}"
          release_json="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          test "$(jq -r '.assets | length' <<< "${release_json}")" = 10
          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false \
            --jq '.draft' | grep -qx false
