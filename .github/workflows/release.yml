name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release version to validate without publishing
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

jobs:
  validate:
    name: Validate release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and tag target
        run: |
          set -euo pipefail
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          [[ "${RELEASE_TAG}" == "v${version}" ]] || {
            echo "${RELEASE_TAG} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          grep -Fq "## [${version}]" CHANGELOG.md || {
            echo "CHANGELOG.md has no ${version} release entry" >&2
            exit 1
          }
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
            [[ "${tag_commit}" == "${GITHUB_SHA}" ]] || {
              echo "release tag does not identify the workflow commit" >&2
              exit 1
            }
          fi

      - name: Reject an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "${status}" == "404" ]] || {
            echo "release lookup returned HTTP ${status}; refusing to continue" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: mcp-doctor
          - runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-arm64
            binary: mcp-doctor
          - runner: macos-15
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: mcp-doctor
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: mcp-doctor.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup target add "${TARGET}" --toolchain 1.85.0

      - name: Build release binary
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}"

      - name: Package Unix archive
        if: runner.os != 'Windows'
        shell: bash
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          asset="mcp-doctor-${RELEASE_TAG}-${PLATFORM}"
          mkdir -p "staging/${asset}" dist
          cp "target/${TARGET}/release/${BINARY}" "staging/${asset}/"
          cp LICENSE README.md README.zh-CN.md CHANGELOG.md "staging/${asset}/"
          tar -czf "dist/${asset}.tar.gz" -C staging "${asset}"
          (cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256")

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "mcp-doctor-${env:RELEASE_TAG}-${env:PLATFORM}"
          $packageDir = "staging/${asset}"
          New-Item -ItemType Directory -Path $packageDir, dist -Force | Out-Null
          Copy-Item "target/${env:TARGET}/release/${env:BINARY}" $packageDir
          Copy-Item LICENSE, README.md, README.zh-CN.md, CHANGELOG.md $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/${asset}.zip"
          $hash = (Get-FileHash "dist/${asset}.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText(
            "$PWD/dist/${asset}.zip.sha256",
            "${hash}  ${asset}.zip`n",
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-doctor-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Verify release assets
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify asset set and checksums
        run: |
          set -euo pipefail
          [[ "$(find release-assets -maxdepth 1 -type f | wc -l | tr -d ' ')" == "8" ]] || {
            echo "expected four archives and four checksums" >&2
            exit 1
          }
          (cd release-assets && sha256sum --check --strict -- ./*.sha256)

  attest:
    name: Attest release archives
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-assets/*.tar.gz
            release-assets/*.zip

  release:
    name: Publish GitHub Release
    needs: [verify, attest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Reverify tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")" == "${GITHUB_SHA}" ]] || {
            echo "release tag changed during the workflow" >&2
            exit 1
          }
          (cd release-assets && sha256sum --check --strict -- ./*.sha256)
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          [[ "${#assets[@]}" == "8" ]] || {
            echo "unexpected release asset count" >&2
            exit 1
          }
          gh release create "${RELEASE_TAG}" "${assets[@]}" \
            --draft --generate-notes --title "MCP Doctor ${RELEASE_TAG}" --verify-tag
          gh release edit "${RELEASE_TAG}" --draft=false
